<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="version" content="20260731-0700-v10-ui-redesign">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生活手帐">
<meta name="theme-color" content="#faf9f7">
<title>🌿 生活手帐</title>
<style>
/* ====== 设计系统 v2.0 ====== */
:root{
  /* 配色 - 柔和温暖，不刺眼 */
  --bg: #faf9f7;
  --bg-warm: #f5f0ea;
  --card: #ffffff;
  --text: #3a3632;
  --text-secondary: #6b6560;
  --muted: #a09890;
  --accent: #e89878;
  --accent-light: #fef0ec;
  --accent2: #c9919a;
  --green: #7db88a;
  --green-light: #edf7ef;
  --blue: #7aa8c8;
  --blue-light: #eef4f9;
  --yellow: #e5c07a;
  --yellow-light: #fdf6e8;
  --red: #e07070;
  --red-light: #fceeee;
  --border: #ede8e3;
  --shadow-sm: 0 1px 3px rgba(58,54,50,.06);
  --shadow-md: 0 4px 16px rgba(58,54,50,.08);
  --shadow-lg: 0 8px 30px rgba(58,54,50,.10);
  --radius-sm: 12px;
  --radius: 18px;
  --radius-lg: 24px;
  --nav-height: 68px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  max-width:600px;
  margin:0 auto;
  padding:0 0 calc(var(--nav-height) + env(safe-area-inset-bottom));
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ====== 状态栏（首页顶部） ====== */
.status-bar{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:28px 20px 24px;
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  color:#fff;
  position:relative;
  overflow:hidden;
}
.status-bar::before{
  content:'';
  position:absolute;top:-30px;right:-30px;width:120px;height:120px;
  background:rgba(255,255,255,.08);border-radius:50%;
}
.status-bar::after{
  content:'';
  position:absolute;bottom:-20px;left:-10px;width:80px;height:80px;
  background:rgba(255,255,255,.06);border-radius:50%;
}
.status-bar .sb-date{font-size:.82rem;opacity:.85;margin-bottom:4px;}
.status-bar .sb-greeting{font-size:1.25rem;font-weight:700;letter-spacing:.5px;}
.status-bar .sb-energy{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:8px;font-size:.8rem;background:rgba(255,255,255,.18);
  padding:4px 12px;border-radius:20px;width:fit-content;
}
.status-bar .sb-dot{width:8px;height:8px;border-radius:50%;background:#7db88a;}

/* ====== 页面标题（子页面） ====== */
.page-header{
  padding:24px 20px 16px;
  display:flex;align-items:center;gap:10px;
}
.page-header h1{font-size:1.35rem;font-weight:700;color:var(--text);}
.page-header .ph-icon{font-size:1.4rem;}

/* ====== 卡片系统 ====== */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:18px 18px;
  margin:0 16px 14px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--border);
  transition:box-shadow .2s;
}
.card:active{box-shadow:var(--shadow-md);}
.card-title{
  font-size:.92rem;font-weight:700;
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
  color:var(--text);
}
.card-title .ico{font-size:1.15rem;flex-shrink:0;}
.card-title .badge{
  margin-left:auto;font-size:.7rem;font-weight:600;
  padding:3px 10px;border-radius:10px;background:var(--bg-warm);color:var(--muted);
}

/* ====== 首页模块网格 ====== */
.module-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px;
}
.mod-card{
  background:var(--card);border-radius:var(--radius);
  padding:20px 14px;text-align:center;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);
  cursor:pointer;transition:all .2s ease;
  position:relative;overflow:hidden;
}
.mod-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;
  transition:opacity .2s;
}
.mod-card:active{transform:scale(.97);box-shadow:var(--shadow-md);}
.mod-card:active::after{opacity:1;}
.mod-card .mod-ico{font-size:2.2rem;display:block;margin-bottom:8px;}
.mod-card .mod-name{font-size:.88rem;font-weight:600;color:var(--text);}

/* ====== 子页面入口按钮 ====== */
.sub-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;
}
.sub-btn{
  background:var(--bg);border-radius:var(--radius-sm);
  padding:16px 8px;text-align:center;
  cursor:pointer;border:1px solid var(--border);
  transition:all .15s;
}
.sub-btn:active{background:var(--accent-light);border-color:var(--accent);transform:scale(.96);}
.sub-btn .sub-ico{font-size:1.6rem;display:block;margin-bottom:5px;}
.sub-btn .sub-name{font-size:.76rem;color:var(--text-secondary);font-weight:500;}

/* ====== 信息行 ====== */
.info-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);
  font-size:.86rem;
}
.info-row:last-child{border-bottom:none;}
.info-row .label{color:var(--muted);font-weight:400;}
.info-row .value{font-weight:600;color:var(--text);}

/* ====== 表格 ====== */
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.83rem;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;}

/* ====== 标签 ====== */
.tag{display:inline-block;padding:3px 11px;border-radius:20px;font-size:.72rem;font-weight:500;}
.tag-red{background:var(--red-light);color:var(--red);}
.tag-green{background:var(--green-light);color:#4a8a5a;}
.tag-yellow{background:var(--yellow-light);color:#b08830;}
.tag-blue{background:var(--blue-light);color:#4a7ca0;}
.tag-muted{background:#f0eeea;color:var(--muted);}

/* ====== 引用/提示框 ====== */
blockquote{
  padding:14px 16px;background:var(--yellow-light);
  border-left:4px solid var(--yellow);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:.83rem;color:var(--text-secondary);margin:12px 0;line-height:1.7;
}
blockquote.accent{
  background:var(--accent-light);border-left-color:var(--accent);
  color:var(--text-secondary);
}

/* ====== 返回按钮 ====== */
.back{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--accent);cursor:pointer;font-size:.86rem;
  padding:10px 4px;font-weight:500;
}
.back:active{opacity:.7;}

/* ====== 待办项（核心交互组件）====== */
.todo-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 4px;border-bottom:1px solid var(--border);
  font-size:.88rem;transition:opacity .2s;
}
.todo-item:last-child{border-bottom:none;}
.todo-item.done{opacity:.45;}
.todo-item.done span{text-decoration:line-through;color:var(--muted);}
.todo-item input[type=checkbox]{
  width:22px;height:22px;min-width:22px;
  accent-color:var(--accent);cursor:pointer;
  border-radius:6px;
}

/* ====== 底部导航栏 ====== */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:600px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:center;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  z-index:100;
}
.nav-btn{
  border:none;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:.68rem;padding:6px 10px;
  transition:all .2s;position:relative;
}
.nav-btn .nav-ico{font-size:1.4rem;transition:transform .2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active .nav-ico{transform:scale(1.1);}

/* ====== 页面切换 ====== */
.page{display:none;}
.page.active{display:block;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ====== 进度条 ====== */
.progress{
  height:7px;background:var(--border);border-radius:4px;
  overflow:hidden;margin-top:10px;
}
.progress .fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1);
}

/* ====== 日期卡片 ====== */
.day-card{
  background:var(--card);border-radius:var(--radius);
  padding:16px 18px;margin:0 16px 12px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);
  cursor:pointer;transition:all .2s;
}
.day-card:active{transform:scale(.98);box-shadow:var(--shadow-md);}
.day-card .day-date{font-size:.95rem;font-weight:700;}
.day-card .day-info{font-size:.78rem;color:var(--muted);margin-top:4px;}

/* ====== 通用元素 ====== */
hr{border:none;border-top:1px solid var(--border);margin:18px 0;}
h2{font-size:1.08rem;margin:22px 16px 12px;color:var(--accent2);font-weight:700;}
h3{font-size:.94rem;margin:16px 0 8px;color:var(--text);font-weight:600;}
p{font-size:.86rem;color:var(--text-secondary);line-height:1.7;}
ul,ol{padding-left:20px;margin:8px 0;font-size:.86rem;color:var(--text-secondary);}
li{margin-bottom:4px;}

/* ====== 输入框 & 按钮 ====== */
input[type=text],input[type=date],textarea,select{
  width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;font-size:.85rem;font-family:inherit;
  background:var(--card);color:var(--text);
  transition:border-color .2s;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:80px;}
button{
  cursor:pointer;font-family:inherit;border:none;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.97);}

/* 主要按钮 */
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-radius:var(--radius-sm);
  padding:11px 18px;font-size:.85rem;font-weight:600;
  box-shadow:0 2px 8px rgba(232,152,120,.3);
}
.btn-primary:active{box-shadow:0 1px 4px rgba(232,152,120,.3);}

/* 次要按钮 */
.btn-secondary{
  background:var(--bg-warm);color:var(--text);
  border-radius:var(--radius-sm);padding:10px 16px;font-size:.84rem;font-weight:500;
}

/* 危险按钮 */
.btn-danger{
  background:var(--red-light);color:var(--red);
  border-radius:var(--radius-sm);padding:10px 14px;font-size:.8rem;
}

/* ====== 宠物区域特殊样式 ====== */
.pet-area-bg{
  background:linear-gradient(145deg,#e8f4fc,#f0e8f8);
  border-radius:var(--radius-lg);padding:28px 20px;text-align:center;
  position:relative;overflow:hidden;
}
.pet-area-bg::before{
  content:'';position:absolute;top:-20px;right:-20px;
  width:100px;height:100px;background:rgba(126,168,200,.12);border-radius:50%;
}

/* ====== 空状态 ====== */
.empty-state{
  text-align:center;padding:32px 20px;color:var(--muted);
}
.empty-state .empty-icon{font-size:2.5rem;margin-bottom:10px;opacity:.5;}
.empty-state p{font-size:.84rem;color:var(--muted);}

/* ====== Toast 提示 ====== */
.toast{
  position:fixed;bottom:calc(var(--nav-height) + 20px);
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:#fff;
  padding:12px 24px;border-radius:24px;
  font-size:.84rem;font-weight:500;z-index:999;
  opacity:0;transition:all .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ====== 滚动条美化 ====== */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ====== 安全区域适配 ====== */
@supports(padding:env(safe-area-inset-bottom)){
  .nav{padding-bottom:env(safe-area-inset-bottom);}
}
</style>
</head>
<body>

<div id="app"></div>

<!-- 底部导航 -->
<nav class="nav">
  <button class="nav-btn active" onclick="go('home')"><span class="nav-ico">🏠</span><span>首页</span></button>
  <button class="nav-btn" onclick="go('daily')"><span class="nav-ico">📅</span><span>每日</span></button>
  <button class="nav-btn" onclick="go('modules')"><span class="nav-ico">🗂️</span><span>模块</span></button>

<!-- Toast -->

<script>

  </div>

</div>

function renderDailyList(){
  let html = '';
  let dates = Object.keys(dailyRecords).sort().reverse();
  dates.forEach(d=>{
    let r = dailyRecords[d];
    let doneCore = r.core ? r.core.filter(t=>t.done).length : 0;
    let totalCore = r.core ? r.core.length : 0;
    let rambleCount = r.rambles ? r.rambles.length : 0;
    html += `<div class="day-card" onclick="go('day-'+${JSON.stringify(d).replace(/"/g,'&quot;')})">
      <div class="day-date">📅 ${d}</div>
      <div class="day-info">核心 ${doneCore}/${totalCore} · 碎碎念 ${rambleCount}条 · 复盘 ${r.review?'✅':'⬜'}</div>
    </div>`;
  });
  document.getElementById('daily-list').innerHTML = html;
}

function renderDayDetail(d){
  let r = dailyRecords[d];
  if(!r) return '<p>暂无记录</p>';
  let html = `<div class="page-header"><span class="back" onclick="go('daily')">← 返回</span><h1>${d}</h1></div>`;
  
  html += '<div class="card"><div class="card-title"><span class="ico">✅</span>核心任务</div>';
  if(r.core){
    r.core.forEach(t=>{
      html += `<div class="todo-item${t.done?' done':''}"><input type="checkbox" ${t.done?'checked':''} disabled><span>${t.text}</span></div>`;
    });
  }
  html += '</div>';
  
  if(r.habits && r.habits.length){
    html += '<div class="card"><div class="card-title"><span class="ico">🔄</span>习惯打卡</div>';
    r.habits.forEach(t=>{
      html += `<div class="todo-item${t.done?' done':''}" style="padding:6px 0;"><input type="checkbox" ${t.done?'checked':''} disabled><span style="font-size:.82rem;">${t.text}</span></div>`;
    });
    html += '</div>';
  }
  
  html += `<div class="card"><div class="card-title"><span class="ico">💤</span>睡眠</div>
    <p>👩 妈妈：${r.sleep.mom}</p><p>👶 宝宝：${r.sleep.baby}</p></div>`;
  
  if(r.food && r.food !== '待记录'){
    html += `<div class="card"><div class="card-title"><span class="ico">🍽️</span>饮食</div><p>${r.food}</p></div>`;
  }
  
  if(r.rambles.length){
    html += '<div class="card"><div class="card-title"><span class="ico">💬</span>碎碎念</div><ul>';
    r.rambles.forEach(rm=> html += `<li><span style="color:var(--muted);font-size:.78rem;">${rm.time}</span> ${rm.text}</li>`);
    html += '</ul></div>';
  }
  
  if(r.review){
    html += '<div class="card"><div class="card-title"><span class="ico">🔄</span>复盘</div>';
    html += `<div class="info-row"><span class="label">最值得记住</span><span class="value">${r.review.best}</span></div>`;
    html += `<div class="info-row"><span class="label">精力</span><span class="value">${r.review.energy}</span></div>`;
    html += `<div class="info-row"><span class="label">消费</span><span class="value">${r.review.spend}</span></div>`;
    html += `<div class="info-row"><span class="label">明日小事</span><span class="value">${r.review.tomorrow}</span></div>`;
    html += '</div>';
  }
  
  return html;
}

// ====== 页面切换 ======
let currentPage = 'home';
function go(page){
  if(page.startsWith('day-')){
    let d = page.substring(4);
    document.getElementById('app').innerHTML = `<div class="back" onclick="go('daily')">← 返回日期列表</div>` + renderDayDetail(d);
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    window.scrollTo(0,0);
    return;
  }
  
  if(!P[page]) return;
  
  let content = P[page];
  let noBack = ['home','modules','me','daily'];
  if(!noBack.includes(page)){
    let backPage = 'home';
    if(page.startsWith('baby')) backPage = 'baby';
    else if(page.startsWith('work')) backPage = 'work';
    else if(page.startsWith('health')) backPage = 'health';
    else if(page.startsWith('items')) backPage = 'items';
    else if(page.startsWith('hobby')) backPage = 'hobby';
    content = `<div class="back" onclick="go('${backPage}')">← 返回</div>` + content;
  }
  
  document.getElementById('app').innerHTML = content;
  
  let navMap = {'home':'home','daily':'daily','modules':'modules','chat':'chat','me':'me'};
  if(page.startsWith('baby')||page.startsWith('work')||page.startsWith('health')||page.startsWith('items')||page.startsWith('hobby')||page.startsWith('period')||page.startsWith('housework')||page.startsWith('drink')||page.startsWith('weekly')||page.startsWith('cosmetics')||page.startsWith('sop')||page.startsWith('projects')) navMap[page] = 'home';
  if(page.startsWith('self')||page.startsWith('observe')||page.startsWith('social')||page.startsWith('knowledge')||page.startsWith('diary')) navMap[page] = 'me';
  
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  let navKey = navMap[page] || 'home';
  let navIndex = {'home':0,'daily':1,'modules':2,'chat':3,'me':4}[navKey];
  if(navIndex !== undefined) document.querySelectorAll('.nav-btn')[navIndex].classList.add('active');
  
  currentPage = page;
  
  // 特殊页面渲染
  if(page === 'home') renderHome();
  if(page === 'work' || page === 'work-record' || page === 'work-knowledge' || page === 'work-social') renderWorkTodos();
  if(page === 'items') renderItemsAlert();
  if(page === 'period') setTimeout(updatePeriodDisplay, 50);
  if(page === 'chat') setTimeout(renderNotepad, 50);
  if(page === 'daily') renderDailyList();
  if(page === 'sop') setTimeout(renderAllSOPs, 50);
  if(page === 'projects') setTimeout(renderProjects, 50);
  if(page === 'baby-star') setTimeout(renderPet, 50);
  if(page === 'baby-growth') setTimeout(renderBabyNotes, 50);
  if(page === 'knowledge') setTimeout(renderKnowledge, 50);
  if(page === 'hobby-xhs') setTimeout(renderXHSContent, 50);
  
  window.scrollTo(0,0);
}

function renderHome(){
  let d = new Date();
  let days = ['日','一','二','三','四','五','六'];
  document.getElementById('home-date').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${days[d.getDay()]}`;
  
  let hour = d.getHours();
  let greeting = '';
  let energyHint = '';
  if(hour < 6){ greeting = '🌙 这么早醒了'; energyHint = '早点休息吧'; }
  else if(hour < 11){ greeting = '🌅 早上好'; energyHint = '新的一天开始了'; }
  else if(hour < 14){ greeting = '☀️ 中午好'; energyHint = '记得吃饭'; }
  else if(hour < 18){ greeting = '🌤️ 下午好'; energyHint = '坚持一下'; }
  else if(hour < 22){ greeting = '🌆 晚上好'; energyHint = '辛苦了一天'; }
  else{ greeting = '🌙 该准备睡觉了'; energyHint = '早点休息'; }
  document.getElementById('home-greeting').textContent = greeting;
  let el = document.getElementById('energy-hint');
  if(el) el.textContent = energyHint;
  
  // 渲染今日核心任务
  let today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  loadTaskStates(today);
  let r = dailyRecords[today];
  let elTodos = document.getElementById('home-todos');
  if(r){
    let coreUndone = r.core.filter(t => !t.done);
    if(coreUndone.length > 0){
      let html = '';
      coreUndone.forEach(t => {
        let idx = r.core.indexOf(t);
        html += `<div class="todo-item"><input type="checkbox" onchange="toggleCoreTodo(${idx})"><span>${t.text}</span></div>`;
      });
      elTodos.innerHTML = html;
    } else {
      elTodos.innerHTML = '<div class="empty-state" style="padding:16px 0;"><p>🎉 今天核心任务全部完成</p></div>';
    }
    let totalCore = r.core.length;
    let doneCore = r.core.filter(t => t.done).length;
    document.getElementById('task-count').textContent = doneCore+'/'+totalCore;
    document.getElementById('task-progress').style.width = (doneCore/totalCore*100)+'%';
  } else {
    elTodos.innerHTML = '<div class="empty-state" style="padding:16px 0;"><p>📝 今天还没有核心任务</p><p style="font-size:.76rem;">跟我说"帮我安排今天的任务"</p></div>';
  }
  
  renderHomeWorkTodos();
  renderHomeLifeTodos();
  renderHomeHabits();
  renderBabyToday();
  renderPeriodReminder();
  renderWeekImportant();
}

// ====== 首页习惯打卡 ======
function getTodayHabits(){
  let d = new Date();
  let today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let r = dailyRecords[today];
  if(r && r.habits) return {date:today, habits:r.habits, record:r};
  return {date:today, habits:[], record:null};
}

function renderHomeHabits(){
  let el = document.getElementById('home-habits');
  let countEl = document.getElementById('habit-count');
  if(!el) return;
  
  let {date, habits} = getTodayHabits();
  loadTaskStates(date);
  
  let active = habits.filter(h => !h.archived);
  
  if(active.length === 0){
    el.innerHTML = '<div class="empty-state" style="padding:14px 0;"><p>📝 还没有习惯</p><p style="font-size:.74rem;">跟我说"帮我添加习惯"</p></div>';
    if(countEl) countEl.textContent = '';
    return;
  }
  
  let done = active.filter(h => h.done).length;
  if(countEl) countEl.textContent = done + '/' + active.length;
  
  let html = '';
  active.forEach((h, i) => {
    let realIdx = habits.indexOf(h);
    html += `<div class="todo-item${h.done?' done':''}" style="padding:8px 0;display:flex;align-items:center;gap:8px;">
      <input type="checkbox" ${h.done?'checked':''} style="flex-shrink:0;" onchange="toggleHabit(${realIdx})">
      <span style="flex:1;font-size:.86rem;${h.done?'color:var(--muted);':''}">${h.text}</span>
      <button onclick="archiveHabit(${realIdx})" title="删除此习惯" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:.9rem;padding:2px 4px;flex-shrink:0;opacity:.45;">✕</button>
    </div>`;
  });
  el.innerHTML = html;
}

function toggleHabit(i){
  let {date, habits} = getTodayHabits();
  if(!habits[i]) return;
  habits[i].done = !habits[i].done;
  saveTaskStates(date);
  renderHomeHabits();
}

function archiveHabit(i){
  let {date, habits} = getTodayHabits();
  if(!habits[i]) return;
  if(!confirm('删除习惯「' + habits[i].text + '」？')) return;
  habits[i].archived = true;
  saveTaskStates(date);
  renderHomeHabits();
}

// ====== 记事本功能 ======
function getNotepad(){ return localStorage.getItem('my_notepad')||''; }
function setNotepad(v){ localStorage.setItem('my_notepad',v); }
function renderNotepad(){
  let ta=document.getElementById('notepad');
  if(ta) ta.value=getNotepad();
  let s=document.getElementById('notepad-status');
  if(s){ let t=getNotepad(); s.textContent=t?'已保存 '+t.length+' 字':''; }
}
function saveNotepad(){
  let ta=document.getElementById('notepad');
  if(!ta) return;
  setNotepad(ta.value);
  let s=document.getElementById('notepad-status');
  if(s) s.textContent='已保存 '+ta.value.length+' 字 · '+new Date().toTimeString().slice(0,5);
}
function appendNotepad(text){
  let ta=document.getElementById('notepad');
  if(!ta) return;
  ta.value+=text;
  ta.focus();
  ta.scrollTop=ta.scrollHeight;
  saveNotepad();
}
function copyNotepad(){
  let text=getNotepad();
  if(!text){ showToast('记事本是空的'); return; }
  let full='请帮我记录以下今天的内容：\n\n'+text;
  if(navigator.clipboard){
    navigator.clipboard.writeText(full).then(()=>showToast('已复制！粘贴到对话框发给我')).catch(()=>fallbackCopy(full));
  } else { fallbackCopy(full); }
}
function clearNotepad(){
  if(!confirm('确定清空记事本吗？')) return;
  localStorage.removeItem('my_notepad');
  renderNotepad();
  showToast('已清空');
}
function fallbackCopy(text){
  let ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy');
  document.body.removeChild(ta);
  showToast('已复制！');
}
function showToast(msg){
  let t=document.getElementById('copy-toast');
  if(!t) return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

    petState.exp = 0;

function getDynamicSOPs(){
  try {
    let raw = localStorage.getItem('all_sops_v2');
    let seeded = localStorage.getItem('sop_v2_seeded');
    if(!raw){
      let d = defaultDynamicSOPs();
      localStorage.setItem('all_sops_v2', JSON.stringify(d));
      localStorage.setItem('sop_v2_seeded','1');
      return d;
    }
    let parsed = JSON.parse(raw);
    if(!seeded){
      let merged = Object.assign({}, defaultDynamicSOPs(), parsed);
      localStorage.setItem('all_sops_v2', JSON.stringify(merged));
      localStorage.setItem('sop_v2_seeded','1');
      return merged;
    }
    return parsed;
  } catch(e){ return {}; }
}
function saveDynamicSOPs(sops){ localStorage.setItem('all_sops_v2', JSON.stringify(sops)); }

}
function toggleBuiltinSwimTag(i){
  let item = builtinSwimItems[i];
  if(item.tag==='⭐') item.tag='🔶';
  else if(item.tag==='🔶') item.tag='';

function renderDynamicSOPs(){
  let container = document.getElementById('sop-list-container');
  if(!container) return;
  let sops = getDynamicSOPs();
  let expanded = {};
  try { expanded = JSON.parse(localStorage.getItem('sop_expanded')||'{}'); }catch(e){}
  
  let html = '';
  Object.keys(sops).forEach(key => {
    let sop = sops[key];
    let isOpen = expanded[key] !== false;
    html += `<div class="card" style="padding:14px 16px;">
      <div class="card-title" style="margin-bottom:${isOpen?'12px':'0'};cursor:pointer;" onclick="toggleSOPExpand('${key}')">
        <span class="ico">${sop.icon}</span>${sop.name}
        <span style="margin-left:auto;font-size:.9rem;color:var(--muted);">${isOpen?'▾':'▸'}</span>
      </div>
      <div style="display:${isOpen?'block':'none'};">
        <div id="sop-dyn-${key}"></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
          <input type="text" id="add-dyn-step-${key}" placeholder="添加步骤..." style="flex:1;min-width:80px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px;font-size:.78rem;">
          <button class="btn-primary" style="padding:8px 12px;font-size:.75rem;" onclick="addDynSOPStep('${key}')">➕</button>
          <button class="btn-secondary" style="padding:8px 10px;font-size:.75rem;" onclick="resetDynSOP('${key}')">🔄</button>
          <button class="btn-danger" style="padding:8px 10px;font-size:.75rem;" onclick="deleteDynSOP('${key}')">🗑️</button>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  Object.keys(sops).forEach(key => renderDynSOP(key));
}

function renderDynSOP(key){
  let el = document.getElementById('sop-dyn-'+key);
  if(!el) return;
  let sops = getDynamicSOPs();
  let sop = sops[key];
  if(!sop) return;
  let states = [];
  try{ states = JSON.parse(localStorage.getItem('sop_states_dyn_'+key)||'[]'); }catch(e){}
  
  let html = '';
  sop.items.forEach((item, i) => {
    let checked = states[i]||false;
    let tagHtml = item.tag==='⭐'?'<span style="font-size:.62rem;background:#e8f5e9;color:#388e3c;padding:2px 6px;border-radius:5px;cursor:pointer;" onclick="event.stopPropagation();toggleDynTag(\''+key+'\','+i+')">⭐必做</span>':
                 item.tag==='🔶'?'<span style="font-size:.62rem;background:#fff3e0;color:#e65100;padding:2px 6px;border-radius:5px;cursor:pointer;" onclick="event.stopPropagation();toggleDynTag(\''+key+'\','+i+')">🔶偶尔</span>':
                 '<span style="font-size:.62rem;background:#f0eeea;color:#bbb;padding:2px 6px;border-radius:5px;cursor:pointer;" onclick="event.stopPropagation();toggleDynTag(\''+key+'\','+i+')">标记</span>';
    
    html += `<div class="todo-item${checked?' done':''}" style="padding:5px 0;">
      <input type="checkbox" ${checked?'checked':''} style="flex-shrink:0;" onchange="toggleDynSOPItem('${key}',${i})">
      ${tagHtml}
      <span style="flex:1;font-size:.8rem;">${item.text}</span>
      <span style="font-size:.68rem;color:var(--muted);cursor:pointer;flex-shrink:0;" onclick="deleteDynSOPStep('${key}',${i})">✕</span>
    </div>`;
  });
  el.innerHTML = html || '<p style="font-size:.8rem;color:var(--muted);">还没有步骤</p>';
}

function toggleDynTag(key, idx){
  let sops = getDynamicSOPs();
  if(!sops[key] || !sops[key].items[idx]) return;
  let item = sops[key].items[idx];
  if(!item.tag || item.tag === '') item.tag = '⭐';
  else if(item.tag === '⭐') item.tag = '🔶';
  else item.tag = '';
  saveDynamicSOPs(sops);
  renderDynSOP(key);
}

function toggleDynSOPItem(key, idx){
  let states = [];
  try{ states = JSON.parse(localStorage.getItem('sop_states_dyn_'+key)||'[]'); }catch(e){}
  states[idx] = !states[idx];
  localStorage.setItem('sop_states_dyn_'+key, JSON.stringify(states));
  renderDynSOP(key);
}

function resetDynSOP(key){
  localStorage.removeItem('sop_states_dyn_'+key);
  renderDynSOP(key);
}

function addNewSOP(){
  let nameEl = document.getElementById('new-sop-name');
  if(!nameEl || !nameEl.value.trim()){ alert('请输入SOP名称'); return; }
  let name = nameEl.value.trim();
  let sops = getDynamicSOPs();
  let key = 'dyn_' + Date.now();
  let icons = ['🍳','🧹','🚗','💼','🌙','📝','🛒','💪','📚','🎨','💊','✈️','🐾','📱','🧶','📦','🏠'];
  sops[key] = {name:name, icon:icons[Math.floor(Math.random()*icons.length)], items:[]};
  saveDynamicSOPs(sops);
  nameEl.value = '';
  renderDynamicSOPs();
}

function addDynSOPStep(key){
  let input = document.getElementById('add-dyn-step-'+key);
  if(!input || !input.value.trim()) return;
  let sops = getDynamicSOPs();
  if(!sops[key]) return;
  sops[key].items.push({text:input.value.trim(),tag:''});
  saveDynamicSOPs(sops);
  input.value = '';
  renderDynSOP(key);
}

function deleteDynSOPStep(key, idx){
  if(!confirm('删除这一步？')) return;
  let sops = getDynamicSOPs();
  if(!sops[key]) return;
  sops[key].items.splice(idx, 1);
  saveDynamicSOPs(sops);
  let states = [];
  try{ states = JSON.parse(localStorage.getItem('sop_states_dyn_'+key)||'[]'); }catch(e){}
  states.splice(idx, 1);
  localStorage.setItem('sop_states_dyn_'+key, JSON.stringify(states));
  renderDynSOP(key);
}

function deleteDynSOP(key){
  if(!confirm('删除整个SOP？')) return;
  let sops = getDynamicSOPs();
  delete sops[key];
  saveDynamicSOPs(sops);
  localStorage.removeItem('sop_states_dyn_'+key);
  renderDynamicSOPs();
}

function toggleSOPExpand(key){
  let expanded = {};
  try{ expanded = JSON.parse(localStorage.getItem('sop_expanded')||'{}'); }catch(e){}
  expanded[key] = !(expanded[key] !== false);
  localStorage.setItem('sop_expanded', JSON.stringify(expanded));
  renderDynamicSOPs();
}

function getAllProjects(){
  try {
    let raw = localStorage.getItem('projects_v1');
    if(!raw){
      localStorage.setItem('projects_v1', JSON.stringify(defaultProjects));
      return JSON.parse(JSON.stringify(defaultProjects));
    }
    return JSON.parse(raw);
  } catch(e){
    localStorage.setItem('projects_v1', JSON.stringify(defaultProjects));
    return JSON.parse(JSON.stringify(defaultProjects));
  }
}
function saveProjects(projects){ localStorage.setItem('projects_v1', JSON.stringify(projects)); }

function renderProjects(){
  let container = document.getElementById('project-list');
  if(!container) return;
  let projects = getAllProjects();
  let html = '';
  
  Object.keys(projects).forEach(key => {
    let p = projects[key];
    let done = p.steps.filter(s => s.done).length;
    let total = p.steps.length;
    let pct = Math.round(done/total*100);
    let nextStep = p.steps.find(s => !s.done);
    
    html += `<div class="card">
      <div class="card-title">
        <span class="ico">${p.icon}</span>${p.name}
        <span class="tag ${p.status==='进行中'?'tag-yellow':'tag-green'}" style="font-size:.66rem;margin-left:auto;">${p.status}</span>
      </div>
      <div class="progress" style="margin:8px 0 10px;"><div class="fill" style="width:${pct}%;"></div></div>
      <p style="font-size:.76rem;color:var(--muted);margin-bottom:10px;">${done}/${total} 步完成 · ${pct}%</p>
      
      ${nextStep ? `<div style="background:var(--yellow-light);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;">
        <p style="font-size:.74rem;color:var(--accent);font-weight:600;">📌 下一步</p>
        <p style="font-size:.84rem;">${nextStep.text}</p>
        ${p.nextAction ? `<p style="font-size:.76rem;color:var(--muted);margin-top:4px;">💡 ${p.nextAction}</p>` : ''}
      </div>` : '<p style="color:var(--green);font-size:.84rem;">🎉 全部完成！</p>'}
      
      <div style="margin-top:10px;">`;
    
    p.steps.forEach((s, i) => {
      html += `<div class="todo-item${s.done?' done':''}" style="padding:5px 0;display:flex;align-items:center;gap:8px;">
        <input type="checkbox" ${s.done?'checked':''} style="flex-shrink:0;" onchange="toggleProjectStep('${key}',${i})">
        <span style="font-size:.82rem;${s.done?'color:var(--muted);':''}">${s.text}</span>
      </div>`;
    });
    
    html += `</div>
      ${p.note ? `<blockquote style="font-size:.76rem;margin-top:8px;">${p.note}</blockquote>` : ''}
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="text" id="add-proj-step-${key}" placeholder="添加步骤..." style="flex:1;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px;font-size:.78rem;">
        <button class="btn-primary" style="padding:8px 10px;font-size:.75rem;" onclick="addProjectStep('${key}')">➕</button>
        <button class="btn-danger" style="padding:8px 10px;font-size:.75rem;" onclick="deleteProject('${key}')">🗑️</button>
      </div>
    </div>`;
  });
  
  container.innerHTML = html;
}

function toggleProjectStep(key, idx){
  let projects = getAllProjects();
  if(!projects[key]) return;
  projects[key].steps[idx].done = !projects[key].steps[idx].done;
  saveProjects(projects);
  renderProjects();
}

function addProject(){

  let key = 'proj_' + Date.now();

    name: nameEl.value.trim(),
    icon: icons[Math.floor(Math.random()*icons.length)],
    status: '进行中',
    steps: [], nextAction: '', note: '',
  };
  saveProjects(projects);
  nameEl.value = '';
  renderProjects();
}

function addProjectStep(key){
  let input = document.getElementById('add-proj-step-'+key);
  if(!input || !input.value.trim()) return;
  let projects = getAllProjects();
  if(!projects[key]) return;
  projects[key].steps.push({text:input.value.trim(), done:false});
  saveProjects(projects);
  input.value = '';
  renderProjects();
}

function deleteProject(key){
  if(!confirm('删除这个项目？')) return;
  let projects = getAllProjects();
  delete projects[key];
  saveProjects(projects);
  renderProjects();
}

// ====== 数据备份 ======
function backupData(){
  let data = {};
  for(let i=0; i<localStorage.length; i++){
    let key = localStorage.key(i);
    data[key] = localStorage.getItem(key);
  }
  let blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `生活手帐备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('备份已下载 ✓');
}
