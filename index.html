<style>
:root{
  --bg:#faf8f5;--card:#fff;--text:#333;--muted:#999;--accent:#e8a87c;
  --accent2:#c38d9e;--green:#85b79d;--blue:#7ea8c9;--yellow:#e8d5a3;
  --border:#f0ebe5;--shadow:0 2px 12px rgba(232,168,124,.08);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;max-width:600px;margin:0 auto;padding:0 0 80px;}

/* 顶部标题区 */
.header{padding:24px 16px 8px;text-align:center;}
.header h1{font-size:1.4rem;font-weight:700;}
.header .date{font-size:.8rem;color:var(--muted);margin-top:4px;}
.header .greeting{font-size:.85rem;color:var(--accent);margin-top:6px;}

/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 16px 14px;box-shadow:var(--shadow);border:1px solid var(--border);}
.card-title{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card-title .ico{font-size:1.1rem;}

/* 首页模块卡片网格 */
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px;}
.mod-card{background:var(--card);border-radius:var(--radius);padding:18px 14px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:.2s;}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(232,168,124,.15);}
.mod-card .mod-ico{font-size:2rem;display:block;margin-bottom:8px;}
.mod-card .mod-name{font-size:.9rem;font-weight:600;}
.mod-card .mod-desc{font-size:.72rem;color:var(--muted);margin-top:4px;}

/* 子页面入口按钮 */
.sub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.sub-btn{background:var(--bg);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;border:1px solid var(--border);transition:.2s;}
.sub-btn:hover{background:#fff;border-color:var(--accent);}
.sub-btn .sub-ico{font-size:1.5rem;display:block;margin-bottom:4px;}
.sub-btn .sub-name{font-size:.78rem;color:#555;}

/* 信息行 */
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem;}
.info-row:last-child{border-bottom:none;}
.info-row .label{color:var(--muted);}
.info-row .value{font-weight:500;}

/* 表格 */
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.82rem;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:normal;font-size:.75rem;}

/* 标签 */
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.72rem;}
.tag-red{background:#fce4ec;color:#c62828;}
.tag-green{background:#e8f5e9;color:#2e7d32;}
.tag-yellow{background:#fff3e0;color:#e65100;}
.tag-blue{background:#e3f2fd;color:#1565c0;}

/* 引用 */
blockquote{padding:12px 16px;background:#fff8e1;border-left:3px solid var(--yellow);border-radius:0 12px 12px 0;font-size:.82rem;color:#888;margin:10px 0;}

/* 返回按钮 */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);cursor:pointer;font-size:.85rem;padding:8px 0;margin-bottom:8px;}
.back:hover{color:var(--accent2);}

/* 待办 */
.todo-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.88rem;}
.todo-item:last-child{border-bottom:none;}
.todo-item input{width:18px;height:18px;accent-color:var(--accent);}
.todo-item.done{text-decoration:line-through;color:var(--muted);}

/* 底部导航 */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:100;}
.nav-btn{border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;padding:4px 12px;transition:.2s;}
.nav-btn .nav-ico{font-size:1.3rem;}
.nav-btn.active{color:var(--accent);font-weight:600;}

/* 页面 */
.page{display:none;}
.page.active{display:block;}

/* 进度条 */
.progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px;}
.progress .fill{height:100%;background:var(--accent);transition:.3s;border-radius:3px;}

/* 日期卡片 */
.day-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin:0 16px 10px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:.2s;}
.day-card:hover{transform:translateY(-1px);}
.day-card .day-date{font-size:.95rem;font-weight:600;}
.day-card .day-info{font-size:.78rem;color:var(--muted);margin-top:4px;}

hr{border:none;border-top:1px solid var(--border);margin:16px 0;}

/* 内容区通用 */
h2{font-size:1.05rem;margin:20px 16px 10px;color:var(--accent2);}
h3{font-size:.95rem;margin:14px 0 6px;}
p{font-size:.85rem;color:#555;}
ul,ol{padding-left:20px;margin:6px 0;font-size:.85rem;color:#555;}
</style>

// 宠物系统
const petState = {
  balance: -52,
  happiness: 50,
  level: 1,
  fedCount: 0,
  progress: 0, // 当前等级进度 0-10
};

function loadPetState(){
  try {
    let saved = JSON.parse(localStorage.getItem('pet_state'));
    if(saved) Object.assign(petState, saved);
  } catch(e){}
}
function savePetState(){
  localStorage.setItem('pet_state', JSON.stringify(petState));
}

function feedPet(food){
  loadPetState();
  let costs = {apple:2, cake:5, bath:3};
  let happiness = {apple:5, cake:15, bath:8};
  let names = {apple:'🍎苹果', cake:'🍰蛋糕', bath:'🛁泡澡'};
  let cost = costs[food];
  
  if(petState.balance < 0){
    document.getElementById('feed-msg').innerHTML = '⚠️ 星星负债中（'+petState.balance+'⭐），先还债才能喂小蓝哦！';
    return;
  }
  if(petState.balance < cost){
    document.getElementById('feed-msg').innerHTML = '⚠️ 星星不够！需要'+cost+'⭐，当前只有'+petState.balance+'⭐';
    return;
  }
  
  petState.balance -= cost;
  petState.happiness = Math.min(100, petState.happiness + happiness[food]);
  petState.fedCount++;
  petState.progress++;
  
  // 升级
  if(petState.progress >= 10){
    petState.level++;
    petState.progress = 0;
    document.getElementById('feed-msg').innerHTML = '🎉 小蓝升级了！现在是 Lv.'+petState.level+'！';
  } else {
    document.getElementById('feed-msg').innerHTML = names[food]+' 喂食成功！小蓝好开心~ (+'+happiness[food]+'心情)';
  }
  
  savePetState();
  renderPet();
}

function copyXHS(elId){
  let el = document.getElementById(elId);
  if(!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    alert('✅ 已复制到剪贴板！去小红书粘贴吧～');
  }).catch(() => {
    // Fallback
    let ta = document.createElement('textarea');
    ta.value = el.textContent;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ 已复制到剪贴板！去小红书粘贴吧～');
  });
}

function renderPet(){
  loadPetState();
  let moodText = '';
  let moodEmoji = '';
  if(petState.happiness >= 80){moodText='超级开心';moodEmoji='🥰';}
  else if(petState.happiness >= 60){moodText='很开心';moodEmoji='😊';}
  else if(petState.happiness >= 40){moodText='还不错';moodEmoji='😀';}
  else if(petState.happiness >= 20){moodText='有点饿';moodEmoji='😐';}
  else {moodText='快饿扁了';moodEmoji='😢';}
  
  let el;
  el = document.getElementById('pet-mood'); if(el) el.textContent = moodEmoji+' 状态：'+moodText;
  el = document.getElementById('pet-happiness'); if(el) el.textContent = petState.happiness+'/100';
  el = document.getElementById('pet-happiness-bar'); if(el) el.style.width = petState.happiness+'%';
  el = document.getElementById('pet-lv'); if(el) el.textContent = 'Lv.'+petState.level;
  el = document.getElementById('pet-fed'); if(el) el.textContent = petState.fedCount+' 次';
  el = document.getElementById('pet-level'); if(el) el.textContent = 'Level '+petState.level+' · 喂养进度：'+petState.progress+'/10⭐';
}

function getNotepad(){ return localStorage.getItem('my_notepad')||''; }
function setNotepad(v){ localStorage.setItem('my_notepad',v); }
function renderNotepad(){
  let ta=document.getElementById('notepad');
  if(ta) ta.value=getNotepad();
  let s=document.getElementById('notepad-status');
  if(s){ let t=getNotepad(); s.textContent=t?'已保存 '+t.length+' 字':''; }
}
function saveNotepad(){
  let ta=document.getElementById('notepad');
  if(!ta) return;
  setNotepad(ta.value);
  let s=document.getElementById('notepad-status');
  if(s) s.textContent='已保存 '+ta.value.length+' 字 · '+new Date().toTimeString().slice(0,5);
}
function appendNotepad(text){
  let ta=document.getElementById('notepad');
  if(!ta) return;
  ta.value+=text;
  ta.focus();
  ta.scrollTop=ta.scrollHeight;
  saveNotepad();
}
function copyNotepad(){
  let text=getNotepad();
  if(!text){ showToast('记事本是空的'); return; }
  let full='请帮我记录以下今天的内容：\n\n'+text;
  if(navigator.clipboard){
    navigator.clipboard.writeText(full).then(()=>showToast('已复制！粘贴到对话框发给我')).catch(()=>fallbackCopy(full));
  } else { fallbackCopy(full); }
}
function clearNotepad(){
  if(!confirm('确定清空记事本吗？')) return;
  localStorage.removeItem('my_notepad');
  renderNotepad();
  showToast('已清空');
}
function fallbackCopy(text){
  let ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast('已复制！粘贴到对话框发给我'); }catch(e){}
  document.body.removeChild(ta);
}
function showToast(msg){
  let t=document.getElementById('copy-toast');
  if(t){ t.textContent=msg; t.style.display='block'; setTimeout(()=>{t.style.display='none';},2000); }
}

  sops[key].items.splice(idx, 1);
  saveDynamicSOPs(sops);
  let states = [];
  try { states = JSON.parse(localStorage.getItem('sop_states_dyn_'+key)||'[]'); } catch(e){}
  states.splice(idx, 1);
  localStorage.setItem('sop_states_dyn_'+key, JSON.stringify(states));
  renderDynSOP(key);
}

function deleteDynSOP(key){
  if(!confirm('删除整个SOP？')) return;
  let sops = getDynamicSOPs();
  delete sops[key];
  saveDynamicSOPs(sops);
  localStorage.removeItem('sop_states_dyn_'+key);
  renderDynamicSOPs();
}

function toggleSOPExpand(key){
  let expanded = {};
  try { expanded = JSON.parse(localStorage.getItem('sop_expanded')||'{}'); } catch(e){}
  expanded[key] = !(expanded[key] !== false);
  localStorage.setItem('sop_expanded', JSON.stringify(expanded));
  renderDynamicSOPs();
}

function resetSOP(key){
  localStorage.removeItem('sop_states_'+key);
  if(key === 'builtin-swim') renderBuiltinSwim();
}

function renderAllSOPs(){
  Object.keys(sopData).forEach(key => renderSOP(key));
}

}

function renderDayDetail(d){
  let r = dailyRecords[d];
  if(!r) return '<p>暂无记录</p>';
  let html = `<div class="header"><h1>📅 ${d}</h1></div>`;
  
  html += '<div class="card"><div class="card-title"><span class="ico">✅</span>核心任务</div>';
  if(r.core){
    r.core.forEach(t=>{
      html += `<div class="todo-item${t.done?' done':''}"><input type="checkbox" ${t.done?'checked':''} disabled><span>${t.text}</span></div>`;
    });
  }
  html += '</div>';
  
  if(r.habits && r.habits.length){
    html += '<div class="card"><div class="card-title"><span class="ico">🔄</span>习惯打卡</div>';
    r.habits.forEach(t=>{

    window.scrollTo(0,0);
    return;
  }
  
  if(!P[page]) return;
  
  // 添加返回按钮（首页和模块页不需要）
  let content = P[page];
  let noBack = ['home','modules','me','daily'];
  if(!noBack.includes(page)){
    // 判断返回到哪个页面
    let backPage = 'home';
    if(page.startsWith('baby')) backPage = 'baby';
    else if(page.startsWith('work')) backPage = 'work';
    else if(page.startsWith('health')) backPage = 'health';
    else if(page.startsWith('items')) backPage = 'items';
    else if(page.startsWith('hobby')) backPage = 'hobby';
    content = `<div class="back" onclick="go('${backPage}')">← 返回</div>` + content;
  }
  
  document.getElementById('app').innerHTML = content;
  
  // 更新导航栏
  let navMap = {'home':'home','daily':'daily','modules':'modules','chat':'chat','me':'me'};
  // 模块页和我的页下的子页面高亮对应导航
  if(page.startsWith('baby')||page.startsWith('work')||page.startsWith('health')||page.startsWith('items')||page.startsWith('hobby')||page.startsWith('period')||page.startsWith('housework')||page.startsWith('drink')||page.startsWith('weekly')||page.startsWith('cosmetics')||page.startsWith('sop')||page.startsWith('projects')) navMap[page] = 'home';
  if(page.startsWith('self')||page.startsWith('observe')||page.startsWith('social')||page.startsWith('knowledge')||page.startsWith('diary')) navMap[page] = 'me';
  
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  let navKey = navMap[page] || 'home';
  let navIndex = {'home':0,'daily':1,'modules':2,'chat':3,'me':4}[navKey];
  if(navIndex !== undefined) document.querySelectorAll('.nav-btn')[navIndex].classList.add('active');
  
  currentPage = page;
  
  // 特殊页面渲染
  if(page === 'home') renderHome();
  if(page === 'work' || page === 'work-record' || page === 'work-knowledge' || page === 'work-social') renderWorkTodos();
  if(page === 'items') renderItemsAlert();
  if(page === 'period') setTimeout(updatePeriodDisplay, 50);
  if(page === 'chat') setTimeout(renderNotepad, 50);
  if(page === 'daily') renderDailyList();
  if(page === 'sop') setTimeout(renderAllSOPs, 50);
  if(page === 'projects') setTimeout(renderProjects, 50);
  if(page === 'baby-star') setTimeout(renderPet, 50);
  if(page === 'hobby-xhs') setTimeout(renderXHSContent, 50);
  
  window.scrollTo(0,0);
}

// ====== 首页渲染 ======
function renderHome(){
  let d = new Date();
  let days = ['日','一','二','三','四','五','六'];
  document.getElementById('home-date').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${days[d.getDay()]}`;
  
  let hour = d.getHours();
  let greeting = '';
  if(hour < 6) greeting = '🌙 这么早醒了，注意休息';
  else if(hour < 11) greeting = '🌅 早上好，今天也要加油';
  else if(hour < 14) greeting = '☀️ 中午好，记得吃饭';
  else if(hour < 18) greeting = '🌤️ 下午好，精力还够吗';
  else if(hour < 22) greeting = '🌆 晚上好，辛苦了';
  else greeting = '🌙 该准备睡觉了';
  document.getElementById('home-greeting').textContent = greeting;
  
  // 渲染今日核心任务
  let today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  loadTaskStates(today);
  let r = dailyRecords[today];
  let el = document.getElementById('home-todos');
  if(r){
    let coreUndone = r.core.filter(t => !t.done);
    if(coreUndone.length > 0){
      let html = '';
      coreUndone.forEach(t => {
        let idx = r.core.indexOf(t);
        html += `<div class="todo-item"><input type="checkbox" onchange="toggleCoreTodo(${idx})"><span>${t.text}</span></div>`;
      });
      el.innerHTML = html;
    } else {
      el.innerHTML = '<p style="color:var(--muted);font-size:.82rem;text-align:center;padding:8px 0;">🎉 今天核心任务全部完成</p>';
    }
    let totalCore = r.core.length;
    let doneCore = r.core.filter(t => t.done).length;
    document.getElementById('task-count').textContent = doneCore+'/'+totalCore;
    document.getElementById('task-progress').style.width = (doneCore/totalCore*100)+'%';
  } else {
    el.innerHTML = '<p style="color:var(--muted);font-size:.82rem;text-align:center;padding:8px 0;">📝 今天还没有核心任务<br><span style="font-size:.72rem;">跟我说"帮我安排今天的任务"</span></p>';
  }
  
  // 渲染首页工作待办
  renderHomeWorkTodos();
  // 渲染首页生活待办
  renderHomeLifeTodos();
  // 渲染宝宝今日日程
  renderBabyToday();
  // 渲染经期提醒
  renderPeriodReminder();

  renderWeekImportant();
}

// ====== 经期提醒 ======
function renderPeriodReminder(){
  let card = document.getElementById('period-reminder-card');
  let content = document.getElementById('period-reminder-content');
  if(!card || !content) return;
  
  // 从 localStorage 读取经期数据
  let lastStart = null;
  try { lastStart = localStorage.getItem('period_last_start'); } catch(e){}
  
  if(!lastStart){
    card.style.display = 'none';
    return;
  }
  
  let startDate = new Date(lastStart);
  let today = new Date();
  let daysSince = Math.floor((today - startDate) / (1000*60*60*24));
  let cycleDays = 26;
  let daysUntilNext = cycleDays - daysSince;
  
  if(daysUntilNext <= 0) daysUntilNext += cycleDays;
  
  // 提前5天提醒，以及经期刚结束也显示
  if(daysUntilNext > 5 && daysUntilNext < 22){
    card.style.display = 'none';
    return;
  }
  
  card.style.display = 'block';
  let nextDate = new Date(today);
  nextDate.setDate(today.getDate() + daysUntilNext);
  let nextStr = `${nextDate.getMonth()+1}月${nextDate.getDate()}日`;
  
  let msg = '';
  if(daysUntilNext <= 0){
    msg = `<p style="color:var(--accent2);font-weight:600;">🌸 经期可能已到或延迟，请注意观察</p>`;
  } else if(daysSince >= 0 && daysSince <= 6){
    // 刚来过或在经期中
    msg = `<p style="color:var(--muted);font-size:.82rem;">经期刚过（或正在），注意保暖。下次预计 ${nextStr}。</p>`;
  } else if(daysUntilNext <= 5){
    msg = `<p style="color:var(--accent2);font-weight:600;">⚠️ 预计 ${daysUntilNext} 天后（${nextStr}）来经期</p>
    <ul style="font-size:.8rem;color:var(--text);margin-top:6px;">
      <li>❌ 少冰少辣少咖啡</li>
      <li>✅ 温水、红枣姜茶</li>
      <li>🌙 早睡30分钟</li>
      <li>📦 检查卫生巾库存</li>
    </ul>`;
  } else {
    msg = `<p style="color:var(--muted);font-size:.82rem;">下次预计 ${nextStr}。</p>`;
  }
  
  content.innerHTML = msg;
}

// 从 localStorage 加载/保存任务完成状态
function loadTaskStates(date){
  try {
    let saved = JSON.parse(localStorage.getItem('task_states_'+date));
    if(saved && dailyRecords[date]){
      if(saved.core) saved.core.forEach((done, i) => { if(dailyRecords[date].core[i]) dailyRecords[date].core[i].done = done; });
      if(saved.habits) saved.habits.forEach((done, i) => { if(dailyRecords[date].habits[i]) dailyRecords[date].habits[i].done = done; });
    }
  } catch(e){}
}
function saveTaskStates(date){
  if(dailyRecords[date]){
    let states = {
      core: dailyRecords[date].core.map(t => t.done),
      habits: dailyRecords[date].habits.map(t => t.done)
    };
    localStorage.setItem('task_states_'+date, JSON.stringify(states));
  }
}

function loadTodoStates(key, list){
  try {
    let saved = JSON.parse(localStorage.getItem('todo_'+key));
    if(saved){
      saved.forEach((done, i) => { if(list[i]) list[i].done = done; });
    }
  } catch(e){}
}
function saveTodoStates(key, list){
  localStorage.setItem('todo_'+key, JSON.stringify(list.map(t => t.done)));
}

function renderTodoList(containerId, list, storageKey){
  let container = document.getElementById(containerId);
  if(!container) return;
  loadTodoStates(storageKey, list);
  
  let active = list.filter(t => !t.done);
  let done = list.filter(t => t.done);
  
  let html = '';
  // 未完成
  active.forEach((t, i) => {
    html += `<div class="todo-item" style="padding:8px 0;display:flex;align-items:flex-start;gap:8px;">
      <input type="checkbox" style="margin-top:4px;flex-shrink:0;" onchange="toggleWorkTodo('${storageKey}',${list.indexOf(t)})">
      <span class="tag ${priorityTag[t.priority]||'tag-yellow'}" style="flex-shrink:0;font-size:.7rem;">${t.priority}</span>
      <span style="flex:1;">${t.text}</span>
    </div>`;
  });
  if(active.length === 0) html += '<p style="color:var(--green);font-size:.85rem;">🎉 全部完成！</p>';
  
  // 已完成
  if(done.length > 0){
    html += '<div style="margin-top:12px;padding-top:8px;border-top:1px dashed var(--border);">';
    html += '<p style="font-size:.75rem;color:var(--muted);margin-bottom:4px;">✅ 已完成</p>';
    done.forEach((t, i) => {
      html += `<div class="todo-item done" style="padding:6px 0;display:flex;align-items:flex-start;gap:8px;">
        <input type="checkbox" checked style="margin-top:4px;flex-shrink:0;" onchange="toggleWorkTodo('${storageKey}',${list.indexOf(t)})">
        <span style="flex:1;color:var(--muted);text-decoration:line-through;">${t.text}</span>
      </div>`;
    });
    html += '</div>';
  }
  
  container.innerHTML = html;
}

function toggleWorkTodo(key, idx){
  let list = (key === 'work') ? workTodos : lifeTodos;
  list[idx].done = !list[idx].done;
  saveTodoStates(key, list);
  let cid = (key === 'work') ? 'work-todo-list' : 'life-todo-list';

// ====== 数据备份 ======
function backupData(){
  let data = {};
  for(let i=0; i<localStorage.length; i++){
    let key = localStorage.key(i);
    data[key] = localStorage.getItem(key);
  }
  let blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `生活手帐备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
